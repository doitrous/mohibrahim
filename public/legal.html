<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معلومات قانونية — د. محمد شلبي</title>
<meta name="robots" content="index,follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 4 40 13V26C40 36 33 43 24 45 15 43 8 36 8 26V13Z' fill='%231C2A44'/%3E%3Ccircle cx='34' cy='13' r='3' fill='%23B8934B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Marcellus&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
<style>
  :root{--ink:#1C2A44;--navy2:#33456A;--gold:#B8934B;--gold2:#9A7734;--paper:#F7F1E6;--surface:#FFFDF8;--line:#E7DDC9;--muted:#7C7466;--ink-soft:#41485C;
    --disp:'El Messiri','IBM Plex Sans Arabic',serif;--body:'IBM Plex Sans Arabic',system-ui,sans-serif;}
  html[lang="en"]{--disp:'Marcellus','Times New Roman',serif;--body:'IBM Plex Sans',system-ui,sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.9;-webkit-font-smoothing:antialiased}
  a{color:var(--navy2);text-decoration:none}a:hover{color:var(--gold2)}
  .nav{background:var(--surface);border-bottom:1px solid var(--line)}
  .nav-in{max-width:900px;margin:0 auto;padding:0 24px;height:72px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .name{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--ink)}
  html[lang="en"] .brand .name{font-weight:400}
  .brand .sub{font-size:10.5px;letter-spacing:.14em;color:var(--gold2);font-weight:600;margin-top:3px}
  .navr{display:flex;align-items:center;gap:14px}
  .langtog{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-weight:700;font-size:13px;background:#fff;cursor:pointer}
  .langtog span{padding:7px 12px}.langtog .on{background:var(--ink);color:#fff}.langtog .off{color:var(--muted)}
  .back{font-size:14.5px;font-weight:600;color:var(--ink-soft)}
  main{max-width:820px;margin:0 auto;padding:56px 24px 90px}
  .doctabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
  .doctabs a{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--ink-soft)}
  .doctabs a.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  h1{font-family:var(--disp);font-size:36px;margin:0 0 6px;color:var(--ink);font-weight:700}
  html[lang="en"] h1{font-weight:400}
  .updated{color:var(--muted);font-size:14px;margin-bottom:34px}
  h2{font-family:var(--disp);font-size:21px;margin:32px 0 8px;color:var(--ink);font-weight:600}
  p{margin:0 0 14px;color:var(--ink-soft);font-size:16.5px}
  .brackets{color:var(--gold2);font-style:italic}
  footer{border-top:1px solid var(--line);background:var(--surface)}
  .foot-in{max-width:820px;margin:0 auto;padding:26px 24px;font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  @media(max-width:600px){main{padding:36px 20px 70px}h1{font-size:28px}}
</style>
</head>
<body>
<header class="nav"><div class="nav-in">
  <a class="brand" href="index.html">
    <svg width="38" height="38" viewBox="0 0 48 48" fill="none"><path d="M24 4 L40 13 V26 C40 36 33 43 24 45 C15 43 8 36 8 26 V13 Z" fill="#1C2A44"/><path d="M24 15c-3-2-7-1-7 3 0 3 2 5 3 9 .5 2 1.2 4 2 4s1-1.4 1.5-3 .8-2.5 1.5-2.5 1 1 1.5 2.5S28.5 31 29 31s1.5-2 2-4c1-4 3-6 3-9 0-4-4-5-7-3-1 .7-2 .7-3 0Z" fill="#fff"/><circle cx="34" cy="13" r="2.4" fill="#B8934B"/></svg>
    <span><span class="name">د. محمد شلبي</span><span class="sub" style="display:block">DIAMOND ORTHODONTICS</span></span>
  </a>
  <div class="navr">
    <a class="back" href="index.html" id="backLink">→ العودة للموقع</a>
    <div class="langtog" id="langtog" role="button" tabindex="0" aria-label="Switch language"><span class="on">ع</span><span class="off">EN</span></div>
  </div>
</div></header>

<main>
  <div class="doctabs">
    <a href="?doc=privacy" data-doc="privacy" data-ar="سياسة الخصوصية" data-en="Privacy Policy">سياسة الخصوصية</a>
    <a href="?doc=terms" data-doc="terms" data-ar="الشروط والأحكام" data-en="Terms & Conditions">الشروط والأحكام</a>
    <a href="?doc=disclaimer" data-doc="disclaimer" data-ar="إخلاء المسؤولية الطبية" data-en="Medical Disclaimer">إخلاء المسؤولية الطبية</a>
  </div>
  <h1 id="docTitle">…</h1>
  <div class="updated" id="docUpdated"></div>
  <div id="docBody"></div>
</main>

<footer><div class="foot-in">
  <span id="copy">© 2026 د. محمد إبراهيم شلبي — جميع الحقوق محفوظة.</span>
  <a href="index.html" id="homeLink">الرئيسية</a>
</div></footer>

<script>
(function(){
  var htmlEl=document.documentElement;
  var params=new URLSearchParams(location.search);
  var doc=params.get('doc'); if(['privacy','terms','disclaimer'].indexOf(doc)<0) doc='privacy';
  var lang='ar'; try{ if(localStorage.getItem('lang')==='en') lang='en'; }catch(e){}
  var DATA=null;

  var STATIC={ back:{ar:'→ العودة للموقع',en:'← Back to site'}, home:{ar:'الرئيسية',en:'Home'},
    copy:{ar:'© 2026 د. محمد إبراهيم شلبي — جميع الحقوق محفوظة.',en:'© 2026 Dr. Mohamed Ibrahim Shalaby — All rights reserved.'},
    fallback:{ar:'يتعذّر تحميل هذه الصفحة حاليًا.',en:'This page cannot be loaded right now.'} };

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function renderBody(text){
    var out=''; (text||'').split(/\n\s*\n/).forEach(function(block){
      block=block.trim(); if(!block) return;
      if(block.indexOf('## ')===0){ out+='<h2>'+esc(block.slice(3).trim())+'</h2>'; }
      else { var html=esc(block).replace(/\n/g,'<br>').replace(/(\[[^\]]+\])/g,'<span class="brackets">$1</span>'); out+='<p>'+html+'</p>'; }
    });
    return out;
  }
  function pick(o){ return o ? (lang==='en'?o.en:o.ar) : ''; }

  function render(){
    htmlEl.lang=lang; htmlEl.dir=lang==='en'?'ltr':'rtl';
    document.getElementById('backLink').textContent=STATIC.back[lang];
    document.getElementById('homeLink').textContent=STATIC.home[lang];
    document.getElementById('copy').textContent=STATIC.copy[lang];
    Array.prototype.forEach.call(document.querySelectorAll('.doctabs a'),function(a){
      a.textContent=a.getAttribute(lang==='en'?'data-en':'data-ar');
      a.classList.toggle('active', a.getAttribute('data-doc')===doc);
    });
    var L=DATA&&DATA.legal;
    if(!L||!L[doc]){ document.getElementById('docTitle').textContent=''; document.getElementById('docBody').innerHTML='<p>'+STATIC.fallback[lang]+'</p>'; return; }
    document.getElementById('docTitle').textContent=pick(L[doc].title);
    document.title=pick(L[doc].title)+' — '+(lang==='en'?'Dr. Mohamed Shalaby':'د. محمد شلبي');
    document.getElementById('docUpdated').textContent=pick(L.updated);
    document.getElementById('docBody').innerHTML=renderBody(pick(L[doc].body));
  }

  document.getElementById('langtog').addEventListener('click',function(){ lang=lang==='en'?'ar':'en'; try{localStorage.setItem('lang',lang);}catch(e){} render(); });

  // Live preview from /admin
  window.addEventListener('message',function(e){ var d=e.data||{}; if(d.type==='content'&&d.content){ DATA=d.content; render(); } else if(d.type==='doc'&&d.doc){ doc=d.doc; render(); } else if(d.type==='lang'){ lang=d.lang==='en'?'en':'ar'; render(); } });
  try{ parent.postMessage({type:'ready'},'*'); }catch(_){}

  function loadContent(){ return fetch('/api/content',{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); }).catch(function(){ return fetch('content.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}); }); }
  loadContent().then(function(d){ DATA=d; render(); });
})();
</script>
</body>
</html>
