<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدونة — د. محمد شلبي</title>
<meta name="description" id="metaDesc" content="مقالات ونصائح عن تقويم الأسنان من د. محمد إبراهيم شلبي.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 4 40 13V26C40 36 33 43 24 45 15 43 8 36 8 26V13Z' fill='%231C2A44'/%3E%3Ccircle cx='34' cy='13' r='3' fill='%23B8934B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Marcellus&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap">
<style>
  :root{--ink:#1C2A44;--navy2:#33456A;--gold:#B8934B;--gold2:#9A7734;--paper:#F7F1E6;--surface:#FFFDF8;--mist:#F0E8D9;--line:#E7DDC9;--muted:#7C7466;--ink-soft:#41485C;
    --disp:'El Messiri','IBM Plex Sans Arabic',serif;--body:'IBM Plex Sans Arabic',system-ui,sans-serif;}
  html[lang="en"]{--disp:'Marcellus','Times New Roman',serif;--body:'IBM Plex Sans',system-ui,sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.85;-webkit-font-smoothing:antialiased}
  a{color:var(--navy2);text-decoration:none}a:hover{color:var(--gold2)}
  .nav{background:var(--surface);border-bottom:1px solid var(--line)}
  .nav-in{max-width:1000px;margin:0 auto;padding:0 24px;height:72px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .name{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--ink)}
  html[lang="en"] .brand .name{font-weight:400}
  .brand .sub{font-size:10.5px;letter-spacing:.14em;color:var(--gold2);font-weight:600;margin-top:3px}
  .navr{display:flex;align-items:center;gap:14px}
  .langtog{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-weight:700;font-size:13px;background:#fff;cursor:pointer}
  .langtog span{padding:7px 12px}.langtog .on{background:var(--ink);color:#fff}.langtog .off{color:var(--muted)}
  .back{font-size:14.5px;font-weight:600;color:var(--ink-soft)}
  main{max-width:1000px;margin:0 auto;padding:48px 24px 90px}
  .phead{margin-bottom:34px}
  .eyebrow{color:var(--gold2);font-weight:600;font-size:14px;letter-spacing:.02em}
  h1{font-family:var(--disp);font-size:38px;margin:8px 0 0;color:var(--ink);font-weight:700}
  html[lang="en"] h1{font-weight:400}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;transition:.16s}
  .card:hover{border-color:var(--gold);transform:translateY(-2px)}
  .card .kw{font-size:12.5px;font-weight:600;color:var(--gold2);letter-spacing:.03em}
  .card h3{font-family:var(--disp);font-size:20px;margin:10px 0 8px;color:var(--ink);font-weight:600;line-height:1.35}
  html[lang="en"] .card h3{font-weight:400}
  .card p{font-size:14.5px;color:var(--muted);margin:0}
  .card .date{margin-top:14px;font-size:12.5px;color:var(--muted)}
  .empty{text-align:center;padding:70px 20px;border:1px dashed var(--line);border-radius:20px;background:var(--surface);color:var(--muted)}
  .empty svg{color:var(--gold);opacity:.7}
  /* article */
  article{max-width:760px;margin:0 auto}
  article .kw{color:var(--gold2);font-weight:600;font-size:13px}
  article h1{font-size:40px;margin:10px 0 12px}
  article .meta{color:var(--muted);font-size:14px;margin-bottom:30px}
  article h2{font-family:var(--disp);font-size:24px;margin:34px 0 10px;color:var(--ink);font-weight:600}
  article h3{font-family:var(--disp);font-size:19px;margin:24px 0 8px;color:var(--ink);font-weight:600}
  article p{margin:0 0 16px;font-size:17px;color:var(--ink-soft)}
  article ul{padding-inline-start:22px;margin:0 0 16px}article li{margin-bottom:8px;color:var(--ink-soft)}
  .faq{margin-top:40px;border-top:1px solid var(--line);padding-top:24px}
  .faq h2{margin-top:0}
  details{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:12px}
  summary{cursor:pointer;list-style:none;padding:18px 20px;font-weight:600;color:var(--ink)}
  summary::-webkit-details-marker{display:none}
  details p{padding:0 20px 18px;margin:0}
  .backlink{display:inline-block;margin-bottom:26px;font-weight:600;color:var(--gold2)}
  footer{border-top:1px solid var(--line);background:var(--surface)}
  .foot-in{max-width:1000px;margin:0 auto;padding:26px 24px;font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  @media(max-width:820px){.grid{grid-template-columns:1fr 1fr}}
  @media(max-width:560px){.grid{grid-template-columns:1fr}main{padding:32px 20px 70px}h1,article h1{font-size:28px}}
</style>
</head>
<body>
<header class="nav"><div class="nav-in">
  <a class="brand" href="../index.html">
    <svg width="38" height="38" viewBox="0 0 48 48" fill="none"><path d="M24 4 L40 13 V26 C40 36 33 43 24 45 C15 43 8 36 8 26 V13 Z" fill="#1C2A44"/><path transform="translate(-1.5 0)" d="M24 15c-3-2-7-1-7 3 0 3 2 5 3 9 .5 2 1.2 4 2 4s1-1.4 1.5-3 .8-2.5 1.5-2.5 1 1 1.5 2.5S28.5 31 29 31s1.5-2 2-4c1-4 3-6 3-9 0-4-4-5-7-3-1 .7-2 .7-3 0Z" fill="#fff"/><circle cx="34" cy="13" r="2.4" fill="#B8934B"/></svg>
    <span><span class="name">د. محمد شلبي</span><span class="sub" style="display:block">DIAMOND ORTHODONTICS</span></span>
  </a>
  <div class="navr">
    <a class="back" href="../index.html" id="backLink">→ العودة للموقع</a>
    <div class="langtog" id="langtog" role="button" tabindex="0" aria-label="Switch language"><span class="on">ع</span><span class="off">EN</span></div>
  </div>
</div></header>

<main id="view"></main>

<footer><div class="foot-in">
  <span id="copy">© 2026 د. محمد إبراهيم شلبي — جميع الحقوق محفوظة.</span>
  <a href="../index.html" id="homeLink">الرئيسية</a>
</div></footer>

<script>
(function(){
  var htmlEl=document.documentElement;
  var lang='ar'; try{ if(localStorage.getItem('lang')==='en') lang='en'; }catch(e){}
  var slug=new URLSearchParams(location.search).get('slug');
  var ARTICLES=[];
  var T={
    eyebrow:{ar:'مدونة تقويم الأسنان',en:'Orthodontics Blog'},
    title:{ar:'مقالات ونصائح',en:'Articles & Tips'},
    empty:{ar:'المقالات قريبًا — يتم نشرها تلقائيًا عبر SEOHub.',en:'Articles coming soon — published automatically via SEOHub.'},
    back:{ar:'→ العودة للموقع',en:'← Back to site'},
    home:{ar:'الرئيسية',en:'Home'},
    allposts:{ar:'كل المقالات',en:'All articles'},
    copy:{ar:'© 2026 د. محمد إبراهيم شلبي — جميع الحقوق محفوظة.',en:'© 2026 Dr. Mohamed Ibrahim Shalaby — All rights reserved.'}
  };
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inline(t){ return esc(t).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" rel="noopener">$1</a>'); }
  function mdToHtml(md){
    var out='', list=false; var lines=String(md||'').split('\n');
    function closeList(){ if(list){ out+='</ul>'; list=false; } }
    lines.forEach(function(ln){
      var l=ln.trim();
      if(!l){ closeList(); return; }
      if(l.indexOf('### ')===0){ closeList(); out+='<h3>'+inline(l.slice(4))+'</h3>'; }
      else if(l.indexOf('## ')===0){ closeList(); out+='<h2>'+inline(l.slice(3))+'</h2>'; }
      else if(l.indexOf('# ')===0){ closeList(); out+='<h2>'+inline(l.slice(2))+'</h2>'; }
      else if(l.indexOf('- ')===0||l.indexOf('* ')===0){ if(!list){ out+='<ul>'; list=true; } out+='<li>'+inline(l.slice(2))+'</li>'; }
      else { closeList(); out+='<p>'+inline(l)+'</p>'; }
    });
    closeList(); return out;
  }
  function forLang(){ return ARTICLES.filter(function(a){ return (a.lang||'ar')===lang; }); }
  function fmtDate(d){ if(!d) return ''; try{ return new Date(d).toLocaleDateString(lang==='en'?'en-GB':'ar-EG',{year:'numeric',month:'long',day:'numeric'}); }catch(e){ return d; } }

  function renderList(){
    document.title=(lang==='en'?'Blog':'مدونة')+' — '+(lang==='en'?'Dr. Mohamed Shalaby':'د. محمد شلبي');
    var items=forLang();
    var h='<div class="phead"><div class="eyebrow">'+T.eyebrow[lang]+'</div><h1>'+T.title[lang]+'</h1></div>';
    if(!items.length){
      h+='<div class="empty"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 5h16v14H4zM4 9h16M8 13h8M8 16h5"/></svg><p style="margin-top:14px">'+T.empty[lang]+'</p></div>';
    } else {
      h+='<div class="grid">';
      items.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }).forEach(function(a){
        h+='<a class="card" href="?slug='+encodeURIComponent(a.slug)+'">'+(a.keyword?'<div class="kw">'+esc(a.keyword)+'</div>':'')+
           '<h3>'+esc(a.title||a.metaTitle||a.slug)+'</h3>'+
           '<p>'+esc((a.metaDescription||'').slice(0,120))+'</p>'+
           (a.date?'<div class="date">'+fmtDate(a.date)+'</div>':'')+'</a>';
      });
      h+='</div>';
    }
    document.getElementById('view').innerHTML=h;
  }

  function renderArticle(a){
    document.title=(a.metaTitle||a.title)+' — '+(lang==='en'?'Dr. Mohamed Shalaby':'د. محمد شلبي');
    var md=document.getElementById('metaDesc'); if(md&&a.metaDescription) md.setAttribute('content',a.metaDescription);
    var h='<a class="backlink" href="./">'+ (lang==='en'?'← ':'→ ') + T.allposts[lang] +'</a>';
    h+='<article>'+(a.keyword?'<div class="kw">'+esc(a.keyword)+'</div>':'')+
       '<h1>'+esc(a.title||a.metaTitle)+'</h1>'+
       (a.date?'<div class="meta">'+fmtDate(a.date)+'</div>':'')+
       mdToHtml(a.bodyMd);
    if(a.faq&&a.faq.length){
      h+='<div class="faq"><h2>'+(lang==='en'?'FAQ':'الأسئلة الشائعة')+'</h2>';
      a.faq.forEach(function(f){ h+='<details><summary>'+esc(f.q)+'</summary><p>'+inline(f.a)+'</p></details>'; });
      h+='</div>';
    }
    if(a.internalLinks&&a.internalLinks.length){
      h+='<div class="faq"><h2>'+(lang==='en'?'Related':'مقالات ذات صلة')+'</h2><ul>';
      a.internalLinks.forEach(function(l){ h+='<li><a href="?slug='+encodeURIComponent(l.slug)+'">'+esc(l.title)+'</a></li>'; });
      h+='</ul></div>';
    }
    h+='</article>';
    document.getElementById('view').innerHTML=h;
    // Article structured data for SEO
    var ld={ "@context":"https://schema.org","@type":"Article","headline":a.title||a.metaTitle,"description":a.metaDescription||"","inLanguage":a.lang||'ar',"author":{"@type":"Person","name":"Dr. Mohamed Ibrahim Shalaby"},"publisher":{"@type":"Organization","name":"Diamond Orthodontics"} };
    if(a.date) ld.datePublished=a.date;
    var s=document.getElementById('ld'); if(!s){ s=document.createElement('script'); s.type='application/ld+json'; s.id='ld'; document.head.appendChild(s); }
    s.textContent=JSON.stringify(ld);
  }

  function render(){
    htmlEl.lang=lang; htmlEl.dir=lang==='en'?'ltr':'rtl';
    document.getElementById('backLink').textContent=T.back[lang];
    document.getElementById('homeLink').textContent=T.home[lang];
    document.getElementById('copy').textContent=T.copy[lang];
    if(slug){ var a=ARTICLES.filter(function(x){return x.slug===slug && (x.lang||'ar')===lang;})[0] || ARTICLES.filter(function(x){return x.slug===slug;})[0]; if(a){ renderArticle(a); return; } }
    renderList();
  }

  document.getElementById('langtog').addEventListener('click',function(){ lang=lang==='en'?'ar':'en'; try{localStorage.setItem('lang',lang);}catch(e){} render(); });

  function loadArticles(){ return fetch('/api/articles',{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); }).catch(function(){ return fetch('articles.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():[];}).catch(function(){return [];}); }); }
  loadArticles().then(function(d){ ARTICLES=Array.isArray(d)?d:(d.articles||[]); render(); });
})();
</script>
</body>
</html>
